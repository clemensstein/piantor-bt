# Der Dongle haengt per USB am Host (kein BLE zum PC) und ist Central
# fuer die beiden Tastaturhaelften. Die folgenden Optionen betreffen die
# Funkstrecke Dongle <-> Haelften.

# Mehr Sendeleistung fuer eine stabile Verbindung zu den Haelften.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Verbesserte Verbindungsstabilitaet (wie an den Haelften gesetzt).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
